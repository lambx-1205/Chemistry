name: Enrich PubChem identities

on:
  push:
    paths:
      - "chemistry-data.js"
      - "tools/enrich_pubchem.py"
      - ".github/workflows/pubchem-enrichment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubchem-enrichment-main
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve eligible structures with PubChem
        run: python tools/enrich_pubchem.py

      - name: Commit verified identifiers
        run: |
          if git diff --quiet -- chemistry-data.js; then
            echo "No new verified PubChem records to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemistry-data.js
          git commit -m "Enrich verified PubChem identities"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after fetching latest main."
          done
          echo "Could not push enriched data after 3 attempts."
          exit 1
